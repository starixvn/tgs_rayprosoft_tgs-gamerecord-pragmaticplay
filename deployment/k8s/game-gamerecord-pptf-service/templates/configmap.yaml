apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-pptf-service.fullname" . }}
  labels:
    {{- include "game-gamerecord-pptf-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameRecord": {
        "GameProvidersBaseUrl": "http://game-gameproviders",
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver",
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules"
      },
      "GameRecordInfo": {
        "MongoDefine": "gp.gamerecord.database",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.round.pptf",
        "GameProviderCode": "PPTF",
        "GameProviderConfiguration": "PPTFConfiguration",
        "MaxIntervalMinute": 10,
        "IntervalMinute": 10,
        "LockMinute": 8.5,
        "VirtualSportsIntervalMinute": 10,
        "LiveDealerIntervalMinute": 1
      }
    }