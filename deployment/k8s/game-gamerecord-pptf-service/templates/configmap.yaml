apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-pptf-service.fullname" . }}
  labels:
    {{- include "game-gamerecord-pptf-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "PPTF",
        "GameProviderConfiguration": "PPTFConfiguration",
        "IntervalMinutes": 2,
        "IntervalMinutesMax": 10,
        "IntervalMinutesMinimum": 1,
        "VirtualSportsIntervalMinutes": 10,
        "LiveDealerIntervalMinutes": 2,
        "LockMinute": 8
      },
      "GameRecord": {
        "GameProvidersBaseUrl": "http://game-gameproviders/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }