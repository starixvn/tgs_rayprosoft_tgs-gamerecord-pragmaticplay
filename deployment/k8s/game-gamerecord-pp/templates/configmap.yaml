apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-pp.fullname" . }}
  labels:
    {{- include "game-gamerecord-pp.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Tgs.GameRecord.Pinnacle.Messages": "Information"
        }
      },
      "GameRecordInfo": {
        "GameProviderCode": "PPTF",
        "GameProviderConfiguration": "PPTFConfiguration",
        "GameProviderHangfire": "pptf-schedule:hangfire:",
        "GameDataTypes": [
          "RNG",
          "LC",
          "VSB"
        ],
        "IntervalMinutes": 1,
        "IntervalMinutesMax": 10,
        "IntervalMinutesMinimum": 1,
        "VirtualSportsIntervalMinutes": 10,
        "LiveDealerIntervalMinutes": 5,
        "LockMinute": 8
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameInterfaceClientBaseUrl": "dns:///game-gameinterface-pp:9090/",
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]